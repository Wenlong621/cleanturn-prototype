<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanTurn · 产品需求文档（PRD）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .prd-wrap { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 30px 20px 80px; }
  .prd-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .prd-top .brand { display: flex; align-items: center; gap: 10px; }
  .prd-top .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--spruce); color: #F3EFE2; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 900; font-size: 17px; }
  .prd-top b { font-family: var(--font-display); font-size: 16px; }
  .prd-doc { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-1); padding: clamp(22px, 5vw, 52px); }

  .md h1 { font-size: clamp(23px, 4vw, 30px); margin: 8px 0 18px; font-weight: 900; }
  .md h2 { font-size: 20px; margin: 38px 0 12px; padding-top: 20px; border-top: 1px dashed var(--line-strong); }
  .md h2:first-of-type { border-top: none; padding-top: 0; }
  .md h3 { font-size: 16px; margin: 22px 0 8px; }
  .md p { margin: 8px 0; font-size: 14.5px; }
  .md ul, .md ol { margin: 8px 0 8px 22px; font-size: 14.5px; }
  .md li { margin: 4px 0; }
  .md blockquote { border-left: 3px solid var(--amber); background: var(--amber-soft); padding: 10px 14px; border-radius: 0 10px 10px 0; margin: 12px 0; font-size: 13.5px; color: #6B4E12; }
  .md blockquote p { margin: 0; font-size: 13.5px; }
  .md code { background: var(--bg-deep); border-radius: 5px; padding: 1px 6px; font-size: 12.5px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  .md pre { background: #21302A; color: #D8E4DC; border-radius: 12px; padding: 16px 18px; overflow-x: auto; margin: 12px 0; font-size: 12.5px; line-height: 1.7; }
  .md pre code { background: none; color: inherit; padding: 0; font-size: 12.5px; }
  .md .tbl-scroll { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: 12px; }
  .md table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px; }
  .md th { background: var(--spruce-soft); color: var(--spruce-deep); text-align: left; padding: 9px 12px; font-size: 12.5px; white-space: nowrap; }
  .md td { padding: 8px 12px; border-top: 1px solid #EFEADB; vertical-align: top; }
  .md hr { border: none; border-top: 1px dashed var(--line-strong); margin: 26px 0; }
  .md strong { font-weight: 700; }
  .loading { text-align: center; color: var(--ink-3); padding: 60px 0; }
</style>
</head>
<body>
<div class="prd-wrap">
  <div class="prd-top">
    <a class="brand" href="index.html"><span class="logo">扫</span><b>CleanTurn · PRD</b></a>
    <div style="display:flex;gap:8px">
      <a class="btn btn-ghost btn-sm" href="cleaner.html">清洁端原型</a>
      <a class="btn btn-ghost btn-sm" href="admin.html">管理端原型</a>
      <a class="btn btn-primary btn-sm" href="PRD.md" download>下载 Markdown</a>
    </div>
  </div>
  <div class="prd-doc"><div class="md" id="md"><div class="loading">正在加载 PRD…</div></div></div>
</div>
<script>
/* 轻量 Markdown 渲染（标题/列表/表格/代码块/引用/加粗/行内代码/链接） */
(function () {
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s（(])((?:https?:\/\/)[^\s）)，,<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');

  function renderMD(src) {
    const lines = src.replace(/\r\n/g, "\n").split("\n");
    let html = "", i = 0, listStack = null;
    const closeList = () => { if (listStack) { html += `</${listStack}>`; listStack = null; } };
    while (i < lines.length) {
      const L = lines[i];
      if (/^```/.test(L)) {
        closeList();
        let buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++;
        html += `<pre><code>${esc(buf.join("\n"))}</code></pre>`;
        continue;
      }
      if (/^\|/.test(L)) {
        closeList();
        const rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
        const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
        const head = cells(rows[0]);
        const body = rows.slice(rows[1] && /^[\s|:-]+$/.test(rows[1]) ? 2 : 1).map(cells);
        html += `<div class="tbl-scroll"><table><thead><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${
          body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
        continue;
      }
      let m;
      if ((m = L.match(/^(#{1,4})\s+(.*)/))) { closeList(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
      else if (/^---\s*$/.test(L)) { closeList(); html += "<hr>"; }
      else if ((m = L.match(/^>\s?(.*)/))) { closeList(); html += `<blockquote><p>${inline(m[1])}</p></blockquote>`; }
      else if ((m = L.match(/^[-*]\s+(.*)/))) {
        if (listStack !== "ul") { closeList(); html += "<ul>"; listStack = "ul"; }
        html += `<li>${inline(m[1])}</li>`;
      }
      else if ((m = L.match(/^\d+\.\s+(.*)/))) {
        if (listStack !== "ol") { closeList(); html += "<ol>"; listStack = "ol"; }
        html += `<li>${inline(m[1])}</li>`;
      }
      else if (L.trim() === "") { closeList(); }
      else { closeList(); html += `<p>${inline(L)}</p>`; }
      i++;
    }
    closeList();
    return html;
  }

  fetch("PRD.md")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(t => { document.getElementById("md").innerHTML = renderMD(t); })
    .catch(() => {
      document.getElementById("md").innerHTML =
        '<div class="loading">无法在线加载（需通过 http 访问）。请直接查看仓库中的 <code>PRD.md</code>。</div>';
    });
})();
</script>
</body>
</html>
